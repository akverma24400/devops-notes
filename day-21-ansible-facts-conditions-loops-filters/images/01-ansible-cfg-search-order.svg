<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
  <rect width="960" height="430" rx="12" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">Which ansible.cfg does Ansible use? It checks in this order</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#5f6368">The FIRST one it finds wins. The rest are ignored.</text>
  <g font-size="15">
    <rect x="80" y="80" width="560" height="56" rx="10" fill="#174ea6"/>
    <text x="100" y="105" fill="#fff" font-weight="700">1.  ANSIBLE_CONFIG environment variable</text>
    <text x="100" y="125" fill="#d2e3fc" font-family="monospace" font-size="13">export ANSIBLE_CONFIG=/path/to/ansible.cfg</text>
    <rect x="80" y="160" width="560" height="56" rx="10" fill="#1a73e8"/>
    <text x="100" y="185" fill="#fff" font-weight="700">2.  ./ansible.cfg  (current folder)</text>
    <text x="100" y="205" fill="#d2e3fc" font-size="13">the one we use: it lives inside the project (in Git)</text>
    <rect x="80" y="240" width="560" height="56" rx="10" fill="#8ab4f8"/>
    <text x="100" y="265" fill="#202124" font-weight="700">3.  ~/.ansible.cfg  (home folder, note the dot)</text>
    <text x="100" y="285" fill="#202124" font-size="13">one config for this user</text>
    <rect x="80" y="320" width="560" height="56" rx="10" fill="#d2e3fc"/>
    <text x="100" y="345" fill="#202124" font-weight="700">4.  /etc/ansible/ansible.cfg  (default)</text>
    <text x="100" y="365" fill="#202124" font-size="13">for the whole server, used only if none of the above exist</text>
    <line x1="360" y1="136" x2="360" y2="158" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
    <line x1="360" y1="216" x2="360" y2="238" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
    <line x1="360" y1="296" x2="360" y2="318" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
    <text x="350" y="152" text-anchor="end" font-size="12" fill="#5f6368">not set?</text>
    <text x="350" y="232" text-anchor="end" font-size="12" fill="#5f6368">not found?</text>
    <text x="350" y="312" text-anchor="end" font-size="12" fill="#5f6368">not found?</text>
    <rect x="680" y="80" width="230" height="296" rx="10" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="795" y="110" text-anchor="middle" font-weight="700" fill="#202124">Check which one</text>
    <text x="700" y="145" font-family="monospace" font-size="14" fill="#202124">ansible --version</text>
    <text x="700" y="180" font-size="13" fill="#202124">look at the line:</text>
    <text x="700" y="205" font-family="monospace" font-size="13" fill="#174ea6">config file = ...</text>
    <text x="700" y="245" font-size="13" fill="#202124">None = no file found,</text>
    <text x="700" y="265" font-size="13" fill="#202124">built-in defaults used</text>
    <text x="700" y="305" font-size="13" fill="#202124">Tip: always cd into the</text>
    <text x="700" y="325" font-size="13" fill="#202124">project folder before</text>
    <text x="700" y="345" font-size="13" fill="#202124">running Ansible</text>
  </g>
  <text x="480" y="410" text-anchor="middle" font-size="13" fill="#5f6368">Only one file is used. Settings are NOT merged from several files.</text>
</svg>
