<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs>
  <rect width="960" height="400" rx="12" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">Facts → Conditions: one playbook works on any OS</text>
  <g font-size="14">
    <rect x="30" y="70" width="220" height="150" rx="10" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="140" y="98" text-anchor="middle" font-weight="700" fill="#174ea6">1. Gathering Facts</text>
    <text x="45" y="125" fill="#202124">first task of every play</text>
    <text x="45" y="148" fill="#202124">(setup module, automatic)</text>
    <text x="45" y="178" fill="#202124">asks the server:</text>
    <text x="45" y="200" fill="#202124">"who are you?"</text>
    <line x1="252" y1="145" x2="300" y2="145" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
    <rect x="305" y="70" width="270" height="150" rx="10" fill="#e6f4ea" stroke="#1e8e3e"/>
    <text x="440" y="98" text-anchor="middle" font-weight="700" fill="#137333">2. ansible_facts (variables)</text>
    <text x="320" y="128" font-family="monospace" font-size="13" fill="#202124">os_family: RedHat</text>
    <text x="320" y="150" font-family="monospace" font-size="13" fill="#202124">distribution: Amazon</text>
    <text x="320" y="172" font-family="monospace" font-size="13" fill="#202124">default_ipv4.address</text>
    <text x="320" y="194" font-family="monospace" font-size="13" fill="#202124">memtotal_mb, processor...</text>
    <line x1="577" y1="145" x2="625" y2="145" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
    <rect x="630" y="70" width="300" height="150" rx="10" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="780" y="98" text-anchor="middle" font-weight="700" fill="#b06000">3. when: (condition)</text>
    <text x="645" y="130" font-family="monospace" font-size="13" fill="#202124">when: ansible_facts.os_family</text>
    <text x="692" y="150" font-family="monospace" font-size="13" fill="#202124">== "RedHat"</text>
    <text x="645" y="185" fill="#202124">true → task runs</text>
    <text x="645" y="207" fill="#202124">false → task is skipped</text>
    <rect x="130" y="260" width="320" height="100" rx="10" fill="#e6f4ea" stroke="#1e8e3e"/>
    <text x="290" y="288" text-anchor="middle" font-weight="700" fill="#137333">Amazon Linux / RHEL (RedHat)</text>
    <text x="150" y="318" fill="#202124">install nginx with dnf → <tspan fill="#b06000" font-weight="700">changed</tspan></text>
    <text x="150" y="342" fill="#202124">install nginx with apt → <tspan fill="#007b83" font-weight="700">skipping</tspan></text>
    <rect x="510" y="260" width="320" height="100" rx="10" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="670" y="288" text-anchor="middle" font-weight="700" fill="#174ea6">Ubuntu (Debian)</text>
    <text x="530" y="318" fill="#202124">install nginx with dnf → <tspan fill="#007b83" font-weight="700">skipping</tspan></text>
    <text x="530" y="342" fill="#202124">install nginx with apt → <tspan fill="#b06000" font-weight="700">changed</tspan></text>
    <line x1="700" y1="222" x2="330" y2="256" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="780" y1="222" x2="690" y2="256" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
  </g>
  <text x="480" y="388" text-anchor="middle" font-size="13" fill="#5f6368">gather_facts: false → no facts → any ansible_facts variable fails as undefined</text>
</svg>
